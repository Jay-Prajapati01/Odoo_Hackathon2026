services:
  mongo:
    image: mongo:7
    container_name: assetflow-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: assetflow
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assetflow-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/assetflow
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SECURE_COOKIE: "false"
      COOKIE_DOMAIN: localhost
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 1000
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@assetflow.io}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-Admin@123456}
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads
      - logs-data:/app/logs

volumes:
  mongo-data:
  uploads-data:
  logs-data:
